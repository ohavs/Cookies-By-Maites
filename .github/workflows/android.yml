name: Android release

on:
  push:
    branches: [main, "ccr-*"]
    paths-ignore: ["docs/**", "web/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Firebase identifiers
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GS" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('FIREBASE_PROJECT='+d['project_info']['project_id'])
          print('FIREBASE_API_KEY='+d['client'][0]['api_key'][0]['current_key'])" >> "$GITHUB_ENV"

      - name: Sign-in + Storage config
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 scripts/firebase/setup.py --read-only

      - name: Decode keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::No keystore secret - building without release"; exit 0; fi
          printf '%s' "$KS" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/release.jks" || { echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KSP" -alias "$KA" >/dev/null || { echo "::error::Keystore/password/alias secrets do not match"; exit 1; }
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          if [ -n "$KEYSTORE_FILE" ]; then cp app/build/outputs/apk/release/app-release.apk cookies-by-maites.apk; fi

      - name: Publish release
        if: env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Cookies by Maites 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: ${{ github.event.head_commit.message }}
          files: cookies-by-maites.apk
          make_latest: true
