<title>Cookies by Maites</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Karantina:wght@400;700&display=swap">
<style>
/* Layout: a phone-sized app (full screen on phones, framed on desktop). Two giant tabs on top, one task per screen, everything else in sheets.
   Tokens are Noted's, 1:1 — every component reads only from them. */
:root {
  --bg: #F5F1EA; --bg-2: #EDE7DD; --surface: #FFFDF9;
  --ink: #1B1915; --ink-2: #6B655C; --ink-3: #A69F94;
  --line: rgba(27,25,21,.09); --scrim: rgba(30,26,20,.28);
  --inverse: #1C1A17; --inverse-2: #2A2723; --inverse-ink: #F6F2EA; --inverse-ink-2: #9C958A;
  --danger: #D8402F; --danger-soft: #FBE1DC;
  --good: #1E7552; --good-soft: #D3EADF;
  --shadow-card: 0 -1px 0 rgba(255,255,255,.55) inset, 0 -10px 28px -18px rgba(40,30,10,.38);
  --shadow-float: 0 18px 50px -18px rgba(30,20,5,.45), 0 2px 8px rgba(30,20,5,.08);
  --n-butter: #FAE5A0; --n-peach: #F9CFB6; --n-rose: #F5C6D2; --n-lilac: #DACDF6;
  --n-sky: #C4DDF5; --n-mint: #C6EAD5; --n-sage: #DBE4C0; --n-sand: #ECE1D2;
  --note-ink: #1D1A15; --note-ink-2: rgba(29,26,21,.62);
  --dough-a: #E9B872; --dough-b: #C98B45; --chip: #4A2C1A;
  --accent: #E0542C; --accent-ink: #FFFFFF; --accent-soft: #F9DDD2;
  --r-card: 30px; --r-lg: 26px; --r-md: 18px; --r-sm: 13px; --gutter: 16px;
  --font-display: "Karantina", "Heebo", system-ui, sans-serif;
  --font-body: "Heebo", system-ui, sans-serif;
  --ds: 1.38; /* Karantina is condensed: display sizes scale up */
  --ease-touch: cubic-bezier(.34,1.56,.64,1); --dur-touch: 420ms;
  --ease-glide: cubic-bezier(.2,.8,.2,1); --dur-glide: 480ms;
  --ease-out: cubic-bezier(.2,.7,.3,1); --dur-fast: 150ms;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12110F; --bg-2: #1A1916; --surface: #1F1D1A;
  --ink: #F3EEE6; --ink-2: #A59E93; --ink-3: #6A645B;
  --line: rgba(243,238,230,.09); --scrim: rgba(0,0,0,.5);
  --inverse: #2A2824; --inverse-2: #37342F; --inverse-ink: #F6F2EA; --inverse-ink-2: #A39C90;
  --danger: #FF6A55; --danger-soft: #3D1F1A; --good: #45C891; --good-soft: #173A2B;
  --shadow-card: 0 1px 0 rgba(255,255,255,.06) inset, 0 -10px 28px -16px rgba(0,0,0,.8);
  --shadow-float: 0 18px 50px -12px rgba(0,0,0,.8);
  --n-butter: #4A4024; --n-peach: #4C3326; --n-rose: #482C35; --n-lilac: #383150;
  --n-sky: #27384A; --n-mint: #243D31; --n-sage: #343D28; --n-sand: #3A342D;
  --note-ink: #F4EFE7; --note-ink-2: rgba(244,239,231,.6);
  --dough-a: #C9984F; --dough-b: #9A6A33; --chip: #2A170C;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #12110F; --bg-2: #1A1916; --surface: #1F1D1A;
  --ink: #F3EEE6; --ink-2: #A59E93; --ink-3: #6A645B;
  --line: rgba(243,238,230,.09); --scrim: rgba(0,0,0,.5);
  --inverse: #2A2824; --inverse-2: #37342F; --inverse-ink: #F6F2EA; --inverse-ink-2: #A39C90;
  --danger: #FF6A55; --danger-soft: #3D1F1A; --good: #45C891; --good-soft: #173A2B;
  --shadow-card: 0 1px 0 rgba(255,255,255,.06) inset, 0 -10px 28px -16px rgba(0,0,0,.8);
  --shadow-float: 0 18px 50px -12px rgba(0,0,0,.8);
  --n-butter: #4A4024; --n-peach: #4C3326; --n-rose: #482C35; --n-lilac: #383150;
  --n-sky: #27384A; --n-mint: #243D31; --n-sage: #343D28; --n-sand: #3A342D;
  --note-ink: #F4EFE7; --note-ink-2: rgba(244,239,231,.6);
  --dough-a: #C9984F; --dough-b: #9A6A33; --chip: #2A170C;
  color-scheme: dark;
}
:root[data-accent="forest"] { --accent: #1E7552; --accent-soft: #D3EADF; }
:root[data-accent="ink"]    { --accent: #3442CF; --accent-soft: #DDE0FA; }
:root[data-accent="plum"]   { --accent: #8E3AB3; --accent-soft: #EBDAF3; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --accent: #FF7A4F; --accent-ink: #1B0E08; --accent-soft: #4A271B; }
  :root:not([data-theme="light"])[data-accent="forest"] { --accent: #45C891; --accent-ink: #06170F; --accent-soft: #173A2B; }
  :root:not([data-theme="light"])[data-accent="ink"]    { --accent: #8A95FF; --accent-ink: #0B0E2B; --accent-soft: #23284F; }
  :root:not([data-theme="light"])[data-accent="plum"]   { --accent: #CF93F0; --accent-ink: #1E0B29; --accent-soft: #3A2348; }
}
:root[data-theme="dark"] { --accent: #FF7A4F; --accent-ink: #1B0E08; --accent-soft: #4A271B; }
:root[data-theme="dark"][data-accent="forest"] { --accent: #45C891; --accent-ink: #06170F; --accent-soft: #173A2B; }
:root[data-theme="dark"][data-accent="ink"]    { --accent: #8A95FF; --accent-ink: #0B0E2B; --accent-soft: #23284F; }
:root[data-theme="dark"][data-accent="plum"]   { --accent: #CF93F0; --accent-ink: #1E0B29; --accent-soft: #3A2348; }

@supports (corner-shape: squircle) {
  :root { --r-card: 54px; --r-lg: 46px; --r-md: 32px; --r-sm: 24px; }
  .sq { corner-shape: squircle; }
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
bdi { unicode-bidi: isolate; }

#device {
  position: relative; height: 100%; width: 100%;
  overflow: hidden; background: var(--bg); isolation: isolate;
}
@media (min-width: 640px) {
  body { background: var(--bg-2); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #device { width: 400px; height: min(860px, 96%); border-radius: 44px;
    box-shadow: 0 40px 100px -30px rgba(0,0,0,.45), 0 0 0 10px var(--inverse), 0 0 0 11px rgba(0,0,0,.2); }
}

/* pressable: the touch spring on release */
.press { transition: transform var(--dur-touch) var(--ease-touch); }
.press:active { transform: scale(.94); transition-duration: var(--dur-fast); transition-timing-function: var(--ease-out); }
.display { font-family: var(--font-display); font-weight: 700; line-height: 1.05; }

/* ---------------------------------------------------------- top */
.top {
  position: absolute; inset: 0 0 auto; z-index: 5;
  padding: max(14px, env(safe-area-inset-top)) var(--gutter) 0;
  background: linear-gradient(var(--bg) 78%, transparent);
}
.top-row { display: flex; align-items: center; justify-content: space-between; height: 48px; }
.brand { font-size: 13px; font-weight: 800; letter-spacing: .08em; color: var(--ink-2); }
.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: conic-gradient(from 200deg, #F4B98F, #E58F6F, #C9A2E8, #F4B98F);
  display: grid; place-items: center; color: #2A1A10;
  font-family: var(--font-display); font-weight: 700; font-size: 24px;
  box-shadow: 0 0 0 3px var(--bg), 0 0 0 4.5px var(--line);
}
.tabs { display: flex; gap: 22px; align-items: flex-start; padding-top: 4px; }
.tab {
  font-family: var(--font-display); font-weight: 700;
  font-size: calc(46px * var(--ds)); line-height: 1; color: var(--ink-3);
  display: flex; gap: 6px; align-items: flex-start;
}
.tab .count {
  font-family: var(--font-body); font-weight: 700; font-size: 14px; margin-top: 12px;
  color: var(--accent); min-width: 18px;
}
.tab-bar { position: relative; height: 3px; margin-top: 2px; }
.tab-bar i { position: absolute; top: 0; height: 3px; border-radius: 3px; background: var(--ink); inset-inline-start: 0; width: 40px; }

/* ---------------------------------------------------------- panes */
.pane {
  position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  overscroll-behavior: contain; scrollbar-width: none;
  padding: calc(max(14px, env(safe-area-inset-top)) + 150px) var(--gutter) 120px;
  will-change: transform;
}
.pane::-webkit-scrollbar { display: none; }

.subrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; color: var(--ink-2); font-size: 15px; }
.filters { display: flex; gap: 18px; }
.filter { font-weight: 700; font-size: 15px; color: var(--ink-3); padding: 6px 0; position: relative; transition: color var(--dur-glide) var(--ease-glide); }
.filter.on { color: var(--ink); }
.filter.on::after { content: ""; position: absolute; inset-inline: 0; bottom: 0; height: 2px; border-radius: 2px; background: var(--accent); }
.city-btn { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: var(--ink); padding: 8px 12px; border-radius: 999px; background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.city-btn svg { width: 16px; height: 16px; }

/* recipe cards */
.cards { display: grid; gap: 14px; }
.rcard {
  position: relative; display: grid; grid-template-columns: 1fr 112px; align-items: center;
  min-height: 150px; padding: 20px 22px; border-radius: var(--r-card);
  color: var(--note-ink); box-shadow: var(--shadow-card); text-align: start; width: 100%;
}
.rcard h3 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: calc(26px * var(--ds)); line-height: 1.02; text-wrap: balance; }
.rcard .meta { margin-top: 6px; font-size: 14px; font-weight: 600; color: var(--note-ink-2); }
.rcard .price { margin-top: 14px; display: flex; align-items: baseline; gap: 6px; }
.rcard .price b { font-family: var(--font-display); font-size: calc(30px * var(--ds)); line-height: 1; }
.rcard .price span { font-size: 13px; font-weight: 700; color: var(--note-ink-2); }
.rcard .art { width: 124px; height: 124px; margin-inline-end: -26px; filter: drop-shadow(0 10px 14px rgba(60,30,5,.25)); }
.rcard .art img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

/* product rows */
.plist { display: grid; gap: 2px; background: var(--surface); border-radius: var(--r-lg); padding: 6px; box-shadow: 0 0 0 1px var(--line); }
.prow { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 12px 10px; border-radius: var(--r-md); text-align: start; width: 100%; }
.prow:hover { background: var(--bg); }
.prow + .prow { border-top: 1px solid var(--line); border-radius: 0 0 var(--r-md) var(--r-md); }
.pic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; color: var(--note-ink); }
.pic svg { width: 22px; height: 22px; }
.prow .nm { font-weight: 700; font-size: 16.5px; display: flex; align-items: center; gap: 6px; }
.prow .nm svg { width: 14px; height: 14px; color: var(--accent); }
.prow .sz { font-size: 13.5px; color: var(--ink-2); font-weight: 500; margin-top: 2px; }
.prow .pr { text-align: end; }
.prow .pr b { font-family: var(--font-display); font-size: calc(22px * var(--ds)); line-height: 1; display: block; }
.prow .pr small { font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.tag { display: inline-block; font-size: 11.5px; font-weight: 800; padding: 2px 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); vertical-align: 1px; }
.tag.muted { background: var(--bg-2); color: var(--ink-2); }

.fab {
  position: absolute; z-index: 6; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); inset-inline-end: 20px;
  width: 64px; height: 64px; border-radius: 22px; background: var(--inverse); color: var(--inverse-ink);
  display: grid; place-items: center; box-shadow: var(--shadow-float);
}
.fab svg { width: 28px; height: 28px; }
.fab2 { inset-inline-end: 96px; width: 52px; height: 52px; border-radius: 18px; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); background: var(--surface); color: var(--ink); box-shadow: var(--shadow-float), 0 0 0 1px var(--line); }
.fab2 svg { width: 24px; height: 24px; }

/* ---------------------------------------------------------- sheets */
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; z-index: 20; }
.sheet {
  position: absolute; inset: auto 0 0; z-index: 21;
  max-height: 94%; display: flex; flex-direction: column;
  background: var(--bg); border-radius: var(--r-card) var(--r-card) 0 0;
  box-shadow: var(--shadow-float); will-change: transform;
}
.sheet .grab { flex: none; height: 26px; display: grid; place-items: center; cursor: grab; touch-action: none; }
.sheet .grab::before { content: ""; width: 42px; height: 5px; border-radius: 5px; background: var(--ink-3); opacity: .5; }
.sheet .body { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; padding: 0 var(--gutter) calc(28px + env(safe-area-inset-bottom, 0px)); }
.sheet .body::-webkit-scrollbar { display: none; }
.sheet h2 { margin: 4px 0 2px; font-family: var(--font-display); font-weight: 700; font-size: calc(36px * var(--ds)); line-height: 1; text-wrap: balance; }
.sheet .sub { color: var(--ink-2); font-size: 15px; font-weight: 500; }
.section { margin-top: 26px; }
.section > .label { font-size: 13px; font-weight: 800; color: var(--ink-2); letter-spacing: .04em; margin: 0 4px 10px; display: flex; justify-content: space-between; align-items: center; }
.box { background: var(--surface); border-radius: var(--r-lg); box-shadow: 0 0 0 1px var(--line); padding: 6px 16px; }
.line { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
.line + .line { border-top: 1px solid var(--line); }
.line .k { font-weight: 600; }
.line .k small { display: block; font-size: 13px; color: var(--ink-2); font-weight: 500; }
.line .v { font-weight: 700; text-align: end; white-space: nowrap; }

/* recipe hero */
.hero { position: relative; height: 210px; margin: 0 calc(var(--gutter) * -1) 6px; display: grid; place-items: center; overflow: hidden; }
.hero .bgc { position: absolute; inset: 0 var(--gutter); border-radius: var(--r-card); }
.hero .art { position: relative; width: 190px; height: 190px; filter: drop-shadow(0 18px 22px rgba(60,30,5,.3)); }
.hero .art img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
.hero .cam { position: absolute; bottom: 14px; inset-inline-end: calc(var(--gutter) + 14px); width: 44px; height: 44px; border-radius: 15px; background: var(--surface); display: grid; place-items: center; box-shadow: var(--shadow-float); }
.hero .cam svg { width: 22px; height: 22px; }
.hero .dots { position: absolute; bottom: 18px; display: flex; gap: 6px; }
.hero .dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--note-ink); opacity: .25; transition: width var(--dur-glide) var(--ease-glide), opacity var(--dur-glide); }
.hero .dots i.on { width: 18px; opacity: .7; }

/* yield */
.yield { display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; text-align: center; padding: 10px 6px; }
.round { width: 52px; height: 52px; border-radius: 18px; background: var(--bg); display: grid; place-items: center; box-shadow: 0 0 0 1px var(--line); }
.round svg { width: 22px; height: 22px; }
.yield .big { font-family: var(--font-display); font-weight: 700; font-size: calc(64px * var(--ds)); line-height: .9; touch-action: none; cursor: ns-resize; user-select: none; }
.yield .unit { font-size: 14px; font-weight: 700; color: var(--ink-2); }
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--bg-2); border-radius: 15px; padding: 4px; margin: 4px 0 10px; }
.seg button { position: relative; z-index: 1; height: 38px; font-weight: 700; font-size: 15px; color: var(--ink-2); transition: color var(--dur-glide) var(--ease-glide); }
.seg button.on { color: var(--ink); }
.seg .thumb { position: absolute; top: 4px; bottom: 4px; border-radius: 11px; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* ingredients */
.ing { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: start; min-height: 58px; }
.ing + .ing { border-top: 1px solid var(--line); }
.ing .pic { width: 36px; height: 36px; border-radius: 12px; }
.ing .pic svg { width: 18px; height: 18px; }
.ing .q { font-size: 13.5px; color: var(--ink-2); font-weight: 600; }
.ing .c { font-weight: 700; }
.ing .c small { display: block; font-size: 12px; color: var(--ink-3); font-weight: 600; }

/* costing — the one inverse surface */
.cost { background: var(--inverse); color: var(--inverse-ink); border-radius: var(--r-card); padding: 20px 20px 18px; }
.cost .line { min-height: 44px; }
.cost .line + .line { border-color: rgba(255,255,255,.08); }
.cost .k small { color: var(--inverse-ink-2); }
.cost .v small { color: var(--inverse-ink-2); font-weight: 600; font-size: 12.5px; margin-inline-end: 6px; }
.cost .total { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 12px; padding-top: 14px; border-top: 1px dashed rgba(255,255,255,.18); }
.cost .total .lbl { font-size: 13px; font-weight: 700; color: var(--inverse-ink-2); }
.cost .total b { display: block; font-family: var(--font-display); font-size: calc(44px * var(--ds)); line-height: .95; }
.cost .total .side { text-align: end; font-size: 14px; color: var(--inverse-ink-2); font-weight: 600; }
.cost .total .side b { font-size: calc(24px * var(--ds)); color: var(--inverse-ink); }
.mini { display: inline-flex; align-items: center; gap: 2px; background: var(--inverse-2); border-radius: 11px; padding: 2px; }
.mini button { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
.mini button svg { width: 15px; height: 15px; }
.mini span { min-width: 54px; text-align: center; font-weight: 700; }

.profit { margin-top: 14px; background: var(--surface); border-radius: var(--r-lg); box-shadow: 0 0 0 1px var(--line); padding: 16px; }
.profit .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.profit .sell { font-family: var(--font-display); font-weight: 700; font-size: calc(32px * var(--ds)); line-height: 1; }
.bar { height: 12px; border-radius: 6px; background: var(--bg-2); overflow: hidden; margin: 14px 0 8px; display: flex; }
.bar i { display: block; height: 100%; }
.bar .c1 { background: var(--ink-3); }
.bar .c2 { background: var(--accent); }
.legend { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.legend b { color: var(--ink); }
.hint { margin-top: 10px; width: 100%; text-align: start; font-size: 14px; color: var(--ink-2); font-weight: 600; }
.hint u { color: var(--accent); text-decoration: none; font-weight: 800; }

.notes { background: var(--n-butter); color: var(--note-ink); border-radius: var(--r-lg); padding: 16px 18px; font-size: 15.5px; line-height: 1.5; }

/* product sheet */
.phead { display: flex; gap: 14px; align-items: center; }
.phead .pic { width: 64px; height: 64px; border-radius: 20px; }
.phead .pic svg { width: 32px; height: 32px; }
.star { width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; background: var(--surface); box-shadow: 0 0 0 1px var(--line); margin-inline-start: auto; flex: none; }
.star svg { width: 22px; height: 22px; }
.star.on { color: var(--accent); }
.barcode { font-family: ui-monospace, monospace; font-size: 12.5px; color: var(--ink-3); letter-spacing: .06em; }
.offer { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; }
.offer + .offer { border-top: 1px solid var(--line); }
.offer .ch { font-weight: 700; }
.offer .br { font-size: 13px; color: var(--ink-2); }
.offer .p { font-family: var(--font-display); font-weight: 700; font-size: calc(22px * var(--ds)); line-height: 1; grid-row: span 2; text-align: end; }
.offer .meter { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--bg-2); overflow: hidden; }
.offer .meter i { display: block; height: 100%; border-radius: 3px; background: var(--ink-3); }
.offer.best .meter i { background: var(--accent); }
.manual { display: flex; align-items: center; gap: 10px; }
.field { flex: 1; display: flex; align-items: center; gap: 6px; height: 50px; padding: 0 14px; background: var(--bg); border-radius: 15px; box-shadow: 0 0 0 1px var(--line) inset; font-weight: 700; }

function hash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }

    const noise = .9 + hash(p.id + ch.id + city) * .22;
    const price = Math.round(p.base * ch.f * C.f * noise * 10) / 10 - .01;
    return { chain: ch, branch: C.streets[i % C.streets.length], price };

/* costing — the one function the Kotlin app will mirror */
function costing(r, units) {
  const f = units / r.yield;

  const pack = r.pack * units, gas = ingredients * r.gas / 100, labor = r.labor * f;
  const total = ingredients + pack + gas + labor;
  return { rows, ingredients, pack, gas, labor, total, perUnit: total / units };

  }

/* ---------------------------------------------------------------- tabs: one glide spring drives panes, titles and the bar */
const panes = [p0, p1], tabs = [...document.querySelectorAll('.tab')];
let tabT = 0;
const tabSpring = new Spring(0, t => {
  tabT = t; const w = 100;
  panes[0].style.transform = `translateX(${t * w}%)`;
  panes[1].style.transform = `translateX(${(t - 1) * w}%)`;
  tabs.forEach((el, i) => { const on = 1 - Math.min(1, Math.abs(t - i)); el.style.color = `color-mix(in srgb, var(--ink) ${on*100}%, var(--ink-3))`; });
  const r0 = tabs[0].getBoundingClientRect(), r1 = tabs[1].getBoundingClientRect(), base = tabs[0].parentElement.getBoundingClientRect();
  const off = i => base.right - [r0, r1][i].right, wid = i => [r0, r1][i].width - 24;
  tabInd.style.transform = `translateX(${-(off(0) + (off(1) - off(0)) * t)}px)`;
  tabInd.style.width = (wid(0) + (wid(1) - wid(0)) * t) + 'px';
  fab.style.transform = ''; scan.hidden = t < .5;
});
tabs.forEach(el => el.onclick = () => { buzz(); tabSpring.to(+el.dataset.i); });
// horizontal swipe between panes (RTL: finger to the right → next tab)
panes.forEach(pn => {
  let st = null;
  pn.addEventListener('touchstart', e => { const t = e.touches[0]; st = { x: t.clientX, y: t.clientY, t0: tabT, on: null, tr: tracker() }; }, { passive: true });
  pn.addEventListener('touchmove', e => {
    if (!st) return; const t = e.touches[0], dx = t.clientX - st.x, dy = t.clientY - st.y;
    if (st.on == null && Math.hypot(dx, dy) > 8) st.on = Math.abs(dx) > Math.abs(dy) * 1.3;
    if (!st.on) return;
    let v = st.t0 + dx / device.clientWidth; if (v < 0) v *= .25; if (v > 1) v = 1 + (v - 1) * .25;
    st.tr.add(dx / device.clientWidth); tabSpring.set(v);
  }, { passive: true });
  pn.addEventListener('touchend', () => { if (!st) return; if (st.on) { const v = st.tr.vel(); let to = Math.round(tabT + v * .18); to = Math.max(0, Math.min(1, to)); if (to !== Math.round(st.t0)) buzz(); tabSpring.to(to, MOTION.glide, v); } st = null; });
});

/* ---------------------------------------------------------------- number tween on the glide spring */
const tweens = new WeakMap();
function tween(el, to, fmt) {
  let s = tweens.get(el);
  if (!s) { s = new Spring(to, v => el.innerHTML = fmt(v)); tweens.set(el, s); s.set(to); return; }
  s.on = v => el.innerHTML = fmt(v); s.to(to);
}

/* ---------------------------------------------------------------- sheets: glide in, drag to dismiss (velocity carried) */
const stackOfSheets = [];
function sheet(html, { onClose } = {}) {
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const el = document.createElement('div'); el.className = 'sheet'; el.setAttribute('role', 'dialog');
  el.innerHTML = `<div class="grab"></div><div class="body">${html}</div>`;
  device.append(scrim, el);
  const z = 20 + stackOfSheets.length * 2; scrim.style.zIndex = z; el.style.zIndex = z + 1;
  const h = () => el.offsetHeight;
  const s = new Spring(1, v => { el.style.transform = `translateY(${v * 100}%)`; scrim.style.opacity = 1 - v; });
  s.set(1); s.to(0);
  const api = { el, body: el.querySelector('.body'), close };
  stackOfSheets.push(api);
  let closing = false;
  async function close(vel) { if (closing) return; closing = true; stackOfSheets.splice(stackOfSheets.indexOf(api), 1); scrim.style.pointerEvents = 'none'; await s.to(1, MOTION.glide, vel); el.remove(); scrim.remove(); onClose && onClose(); }
  scrim.onclick = () => close();
  // drag: from the grab handle anywhere, or from the body when scrolled to top
  let st = null; const body = api.body;
  const down = (y, fromBody) => { if (fromBody && body.scrollTop > 0) return; st = { y, armed: !fromBody, tr: tracker() }; };
  const move = (y, e) => { if (!st) return; const dy = y - st.y; if (!st.armed) { if (dy > 6 && body.scrollTop <= 0) { st.armed = true; st.y = y; } else if (dy < -4) { st = null; } return; }
    e && e.cancelable && e.preventDefault(); const v = Math.max(-.02, (y - st.y) / h()); st.tr.add(v); s.set(v < 0 ? v * .3 : v); };
  const up = () => { if (!st) return; if (st.armed) { const v = st.tr.vel(); if (s.v > .28 || v > 1.2) close(v); else s.to(0, MOTION.touch, v); } st = null; };
  el.querySelector('.grab').addEventListener('pointerdown', e => { e.target.setPointerCapture(e.pointerId); down(e.clientY, false); });
  el.querySelector('.grab').addEventListener('pointermove', e => move(e.clientY));
  el.querySelector('.grab').addEventListener('pointerup', up);
  body.addEventListener('touchstart', e => down(e.touches[0].clientY, true), { passive: true });
  body.addEventListener('touchmove', e => move(e.touches[0].clientY, e), { passive: false });
  body.addEventListener('touchend', up);
  return api;
}
addEventListener('keydown', e => { if (e.key === 'Escape' && stackOfSheets.length) stackOfSheets[stackOfSheets.length - 1].close(); });

function segmented(container, values, current, onPick) {
  container.innerHTML = `<span class="thumb"></span>` + values.map(([v, l]) => `<button data-v="${v}">${l}</button>`).join('');
  const th = container.querySelector('.thumb'), btns = [...container.querySelectorAll('button')];
  let pos = null;
  const sp = new Spring(0, v => { const a = btns[Math.floor(v)], b = btns[Math.min(btns.length - 1, Math.ceil(v))], f = v - Math.floor(v);
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect(), rc = container.getBoundingClientRect();
    const left = ra.left + (rb.left - ra.left) * f - rc.left, w = ra.width + (rb.width - ra.width) * f;
    th.style.left = left + 'px'; th.style.width = w + 'px'; });
  function set(v, anim) { const i = values.findIndex(x => String(x[0]) === String(v)); btns.forEach((b, j) => b.classList.toggle('on', j === i));
    if (i < 0) { th.style.opacity = 0; return; } th.style.opacity = 1; if (anim && pos != null) sp.to(i, MOTION.touch); else sp.set(i); pos = i; }
  btns.forEach(b => b.onclick = () => { buzz(); set(b.dataset.v, true); onPick(b.dataset.v); });
  requestAnimationFrame(() => set(current, false));
  return { set };
}

/* ---------------------------------------------------------------- recipe sheet */
function openRecipe(r) {
  let units = r.yield, sell = r.sell, photoIdx = 0;
  const sh = sheet(`

        <div class="line"><span class="k">גז וחשמל<small>אחוז מהמרכיבים</small></span><span class="v"><span class="mini"><button id="gsM" aria-label="פחות">${ic('minus')}</button><span class="num" id="gsV"></span><button id="gsP" aria-label="יותר">${ic('plus')}</button></span></span></div>
        <div class="line"><span class="k">עבודה<small>למגש של ${r.yield}</small></span><span class="v"><span class="mini"><button id="lbM" aria-label="פחות">${ic('minus')}</button><span class="num" id="lbV"></span><button id="lbP" aria-label="יותר">${ic('plus')}</button></span></span></div>
        <div class="total"><div><span class="lbl">ליחידה</span><b class="num" id="cUnit"></b></div>
          <div class="side">סה״כ<br><b class="num" id="cTot"></b></div></div>
      </div>
      <div class="profit">
        <div class="row"><div><div class="sub" style="font-size:13px;font-weight:700">מחיר מכירה ליחידה</div><div class="sell num" id="sellV"></div></div>
          <span class="mini" style="background:var(--bg-2)"><button id="slM" aria-label="פחות">${ic('minus')}</button><span class="num" style="min-width:8px"></span><button id="slP" aria-label="יותר">${ic('plus')}</button></span></div>
        <div class="bar"><i class="c1" id="barC"></i><i class="c2" id="barP"></i></div>
        <div class="legend"><span>עלות <b class="num" id="lgC"></b></span><span>רווח <b class="num" id="lgP"></b> · <b class="num" id="lgM"></b></span></div>

    ${r.notes ? `<div class="section"><div class="label">הערות</div><div class="notes">${r.notes}</div></div>` : ''}

  `);
  const $ = id => sh.el.querySelector('#' + id);
  const mult = segmented($('mult'), [[.5, '×½'], [1, '×1'], [2, '×2'], [3, '×3']], 1, v => { units = Math.round(r.yield * +v); update(); });
  function update() {
    const c = costing(r, units);
    tween($('yBig'), units, v => Math.round(v));
    const m = units / r.yield; mult.set([.5, 1, 2, 3].includes(+m.toFixed(2)) ? m : -1, true);
    $('ings').innerHTML = c.rows.map(x => `<button class="ing" data-id="${x.p.id}"><span class="pic sq" style="background:var(${x.p.color})">${ic(x.p.icon)}</span>

    $('ings').querySelectorAll('.ing').forEach(b => b.onclick = () => openProduct(prod(b.dataset.id), () => update()));

  step('lbM', () => r.labor = Math.max(0, r.labor - 5)); step('lbP', () => r.labor += 5);

  big.addEventListener('pointermove', e => { if (!dr) return; const n = Math.max(1, dr.u + Math.round((dr.y - e.clientY) / 14)); if (n !== units) { units = n; buzz(); update(); } });

      showPhotos(); renderRecipes(); toast('התמונה נוספה'); }; rd.readAsDataURL(f); };
  $('rArt').onclick = () => { const g = gal(); if (g.length < 2) return; photoIdx = (photoIdx + 1) % g.length; S.photos[r.id] = g[photoIdx]; $('rArt').innerHTML = art(r); showPhotos(); };

    const clr = $('manClr'); if (clr) clr.onclick = () => { delete S.manual[p.id]; saveS(); buzz(); draw(); toast('חזרה למחיר מהרשתות'); };
    $('fav').innerHTML = ic('star', S.favs.has(p.id)); $('fav').classList.toggle('on', S.favs.has(p.id));
    const al = S.alerts[p.id]; $('alSw').classList.toggle('on', al != null); $('alRow').style.opacity = al != null ? 1 : .4;
    $('alV').innerHTML = ils(al ?? Math.floor(os[0].price) - .1);
    const used = RECIPES.filter(r => r.ing.some(([id]) => id === p.id));
    $('usedIn').innerHTML = used.length ? used.map(r => `<div class="line"><span class="k">${r.name}</span><span class="v sub">${qty(r.ing.find(([id]) => id === p.id)[1], p.unit)}</span></div>`).join('') : `<div class="line"><span class="sub">עדיין לא בשום מתכון</span></div>`;
  }
  $('fav').onclick = () => { buzz(); S.favs.has(p.id) ? S.favs.delete(p.id) : S.favs.add(p.id); saveS(); draw(); toast(S.favs.has(p.id) ? 'נוסף למועדפים' : 'הוסר מהמועדפים'); };
  $('manSave').onclick = () => { const v = parseFloat($('man').value.replace(',', '.')); if (!(v > 0)) { $('man').focus(); toast('הקלידו מחיר, למשל 12.90'); return; } S.manual[p.id] = v; saveS(); buzz(); draw(); toast('המחיר הידני נשמר'); };
  $('alSw').onclick = () => { buzz(); if (S.alerts[p.id] != null) delete S.alerts[p.id]; else S.alerts[p.id] = Math.floor(offers(p)[0].price) - .1; saveS(); draw(); };
  const al = d => () => { if (S.alerts[p.id] == null) return; buzz(); S.alerts[p.id] = Math.max(.9, +(S.alerts[p.id] + d).toFixed(2)); saveS(); draw(); };
  $('alM').onclick = al(-.5); $('alP').onclick = al(.5);
  $('pCity').onclick = () => openCity(() => { draw(true); sh.el.querySelector('.section .label span').textContent = `מחירים ב${S.city} · מהזול ליקר`; });
  draw();
}

/* ---------------------------------------------------------------- city picker */
function openCity(after) {
  const sh = sheet(`<h2>עיר</h2><div class="sub">המחירים מסודרים לפי הסניפים בעיר שבחרתם.</div>
    <div class="section"><div class="box cities">${Object.keys(CITIES).map(c => `<button class="city press" data-c="${c}"><span>${c}<br><small>${offers(PRODUCTS[0], c).length} רשתות</small></span>${c === S.city ? ic('check') : ''}</button>`).join('')}</div></div>`);
  sh.el.querySelectorAll('.city').forEach(b => b.onclick = () => { S.city = b.dataset.c; saveS(); buzz(); renderProducts(); renderRecipes(); sh.close(); after && after(); toast(`מחירים ב${S.city}`); });
}

/* ---------------------------------------------------------------- settings + notifications */
function openSettings() {
  const N = S.notif;
  const sh = sheet(`<h2>הגדרות</h2>
    <div class="section"><div class="label">מראה</div><div class="box" style="padding:12px 14px">
      <div class="seg" id="theme" style="margin:0"></div>
      <div class="sw-row" id="acc"></div></div></div>

    <div class="section"><div class="label">התראות · מחירים</div><div class="box">
      <div class="line"><span class="k">ירידת מחיר<small>למוצרים שהגדרתם להם סף</small></span><button class="sw" data-n="drop"></button></div>
      <div class="line"><span class="k">סיכום מחירים שבועי<small>ביום חמישי, 18:00</small></span><button class="sw" data-n="weekly"></button></div></div></div>

    <div class="section"><div class="label">התראות · מיקום</div><div class="box">
      <div class="line"><span class="k">כשנכנסים לסופר<small>רשימת הקניות והמבצעים בסניף</small></span><button class="sw" data-n="enter"></button></div>
      <div id="chainsWrap"><div class="sub" style="font-size:13px;padding-top:4px">באילו רשתות</div><div class="chips" id="chains"></div></div>
      <div class="line"><span class="k">לפי עיר<small>להחליף את עיר המחירים כשמגיעים לעיר אחרת</small></span><button class="sw" data-n="cityAuto"></button></div></div></div>

    <div class="section"><div class="label">התראות · זמנים</div><div class="box">
      <div class="line"><span class="k">תזכורת לרשימת קניות<small>יום שישי, 09:00</small></span><button class="sw" data-n="list"></button></div>
      <div class="line"><span class="k">שעות שקטות<small>22:00–07:00, בלי צליל ורטט</small></span><button class="sw" data-n="quiet"></button></div></div></div>

    <div class="proto-note">אב-טיפוס · כל המחירים והסניפים כאן הם נתונים לדוגמה</div>`);
  const $ = s => sh.el.querySelector(s);
  segmented($('#theme'), [['system', 'מערכת'], ['light', 'בהיר'], ['dark', 'כהה']], S.theme, v => { S.theme = v; saveS(); applyLook(); });
  const accs = [['fire', '#E0542C'], ['forest', '#1E7552'], ['ink', '#3442CF'], ['plum', '#8E3AB3']];
  const drawAcc = () => $('#acc').innerHTML = accs.map(([k, c]) => `<button class="swatch sq press ${S.accent === k ? 'on' : ''}" data-a="${k}" style="background:${c}" aria-label="${k}"></button>`).join('');
  drawAcc(); $('#acc').onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; buzz(); S.accent = b.dataset.a; saveS(); applyLook(); drawAcc(); };
  const drawN = () => { sh.el.querySelectorAll('.sw[data-n]').forEach(s => s.classList.toggle('on', !!N[s.dataset.n]));
    $('#chainsWrap').style.display = N.enter ? '' : 'none';
    $('#chains').innerHTML = CHAINS.map(c => `<button class="chip press ${N.chains.includes(c.id) ? 'on' : ''}" data-c="${c.id}">${c.name}</button>`).join(''); };
  sh.el.querySelectorAll('.sw[data-n]').forEach(s => s.onclick = () => { buzz(); N[s.dataset.n] = !N[s.dataset.n]; saveS(); drawN();
    if (s.dataset.n === 'enter' && N.enter) toast('באפליקציה: בקשת הרשאת מיקום "תמיד"'); });
  $('#chains').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; buzz(); const i = N.chains.indexOf(b.dataset.c); i < 0 ? N.chains.push(b.dataset.c) : N.chains.splice(i, 1); saveS(); drawN(); };
  drawN();
}
avatar.onclick = () => { buzz(); openSettings(); };

/* ---------------------------------------------------------------- add / scan */
fab.innerHTML = ic('plus'); scan.innerHTML = ic('scan');
fab.onclick = () => { buzz(); toast(tabT < .5 ? 'מתכון חדש — בשלב 5' : 'מוצר חדש — בשלב 3'); };
scan.onclick = () => { buzz(); const p = PRODUCTS[Math.floor(Math.random() * PRODUCTS.length)]; toast(`נסרק: ${p.name}`); setTimeout(() => openProduct(p), 500); };

let toastT; function toast(msg) { const t = document.getElementById('toast'); t.innerHTML = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1900); }

renderRecipes(); renderProducts();
requestAnimationFrame(() => tabSpring.set(0));
addEventListener('resize', () => tabSpring.set(tabT));
</script>
