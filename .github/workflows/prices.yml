name: Daily prices

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main, "ccr-*"]
    paths: ["scripts/prices/**", "firestore.rules", ".github/workflows/prices.yml"]

concurrency:
  group: prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Firebase project
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          P=$(printf '%s' "$GS" | python -c "import json,sys;print(json.load(sys.stdin)['project_info']['project_id'])")
          echo "FIREBASE_PROJECT=$P" >> "$GITHUB_ENV"

      - name: Firestore database + rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          python scripts/prices/enable_api.py
          npm i -g firebase-tools@13 >/dev/null 2>&1
          if ! firebase firestore:databases:list --project "$FIREBASE_PROJECT" --non-interactive | grep -q "(default)"; then
            firebase firestore:databases:create "(default)" --location me-west1 --project "$FIREBASE_PROJECT" --non-interactive
          fi
          firebase deploy --only firestore:rules --project "$FIREBASE_PROJECT" --non-interactive

      - name: Fetch prices
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: python scripts/prices/fetch.py

      - name: Publish product catalog
        if: always() && hashFiles('catalog.tsv.gz') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la catalog.tsv.gz
          gh release view catalog >/dev/null 2>&1 || gh release create catalog --title "Product catalog" --notes "Daily product catalog for name search (not an app release)." --prerelease --latest=false
          gh release upload catalog catalog.tsv.gz --clobber
