<title>Cookies by Maites</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: a phone app — app bar, one scrolling screen, white bottom bar with a raised + in the middle.
   Pushed pages slide in over the tabs; every choice happens in a bottom sheet. Sticker style: flat fills, ink outlines. */
:root {
  --bg: #F6F5F1; --surface: #FFFFFF; --surface-2: #EFEEE9; --surface-3: #E3E1DA;
  --ink: #17140F; --ink-dim: #625D55; --ink-faint: #A19B92;
  --divider: rgba(23,20,15,.07); --stroke: #17140F;
  --accent: #F08A24; --accent-fg: #17140F; --accent-ink: #B5560A; --accent-soft: #FDEBD8;
  --good: #1F9D57; --good-soft: #E2F3E9; --danger: #D92D20; --danger-soft: #FDECEC;
  --t-butter: #FFF3C9; --t-peach: #FFE6D6; --t-mint: #E0F2E7; --t-sky: #E3EEFF; --t-lav: #ECE9FF; --t-rose: #FDE3EA;
  --dough-a: #E7B36C; --dough-b: #C2853F; --chip: #3D2414;
  --shadow-card: 0 1px 2px rgba(23,20,15,.04), 0 8px 24px rgba(23,20,15,.05);
  --shadow-float: 0 14px 34px -12px rgba(23,20,15,.28);
  --font: "Rubik", system-ui, -apple-system, sans-serif;
  --ease-out: cubic-bezier(.22,1,.36,1); --ease-spring: cubic-bezier(.34,1.56,.64,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F0E0C; --surface: #1B1A17; --surface-2: #26241F; --surface-3: #322F29;
  --ink: #F5F3EE; --ink-dim: #A8A298; --ink-faint: #6E685F;
  --divider: rgba(255,255,255,.07); --stroke: #0A0908;
  --accent-ink: #FFAE66; --accent-soft: rgba(240,138,36,.16);
  --good: #3CC27A; --good-soft: rgba(60,194,122,.15); --danger: #FF6B5E; --danger-soft: rgba(255,107,94,.14);
  --t-butter: rgba(242,190,40,.14); --t-peach: rgba(255,140,80,.14); --t-mint: rgba(60,194,122,.13); --t-sky: rgba(92,155,255,.14); --t-lav: rgba(130,110,255,.15); --t-rose: rgba(240,90,130,.14);
  --dough-a: #C9984F; --dough-b: #95632C; --chip: #24130A;
  --shadow-card: 0 1px 2px rgba(0,0,0,.35); --shadow-float: 0 14px 34px -12px rgba(0,0,0,.7);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0F0E0C; --surface: #1B1A17; --surface-2: #26241F; --surface-3: #322F29;
  --ink: #F5F3EE; --ink-dim: #A8A298; --ink-faint: #6E685F;
  --divider: rgba(255,255,255,.07); --stroke: #0A0908;
  --accent-ink: #FFAE66; --accent-soft: rgba(240,138,36,.16);
  --good: #3CC27A; --good-soft: rgba(60,194,122,.15); --danger: #FF6B5E; --danger-soft: rgba(255,107,94,.14);
  --t-butter: rgba(242,190,40,.14); --t-peach: rgba(255,140,80,.14); --t-mint: rgba(60,194,122,.13); --t-sky: rgba(92,155,255,.14); --t-lav: rgba(130,110,255,.15); --t-rose: rgba(240,90,130,.14);
  --dough-a: #C9984F; --dough-b: #95632C; --chip: #24130A;
  --shadow-card: 0 1px 2px rgba(0,0,0,.35); --shadow-float: 0 14px 34px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}
:root[data-accent="pistachio"] { --accent: #3DB86B; --accent-ink: #1C7A40; --accent-soft: #E2F3E9; }
:root[data-accent="berry"]     { --accent: #F0507E; --accent-ink: #B42350; --accent-soft: #FDE3EA; }
:root[data-accent="blueberry"] { --accent: #6A7CFF; --accent-ink: #3A4BD6; --accent-soft: #E8EBFF; }
:root[data-theme="dark"][data-accent="pistachio"] { --accent-ink: #6FD896; --accent-soft: rgba(61,184,107,.16); }
:root[data-theme="dark"][data-accent="berry"]     { --accent-ink: #FF8FAE; --accent-soft: rgba(240,80,126,.16); }
:root[data-theme="dark"][data-accent="blueberry"] { --accent-ink: #A3AEFF; --accent-soft: rgba(106,124,255,.16); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"])[data-accent="pistachio"] { --accent-ink: #6FD896; --accent-soft: rgba(61,184,107,.16); }
  :root:not([data-theme="light"])[data-accent="berry"]     { --accent-ink: #FF8FAE; --accent-soft: rgba(240,80,126,.16); }
  :root:not([data-theme="light"])[data-accent="blueberry"] { --accent-ink: #A3AEFF; --accent-soft: rgba(106,124,255,.16); }
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; overflow: hidden; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input { font: inherit; color: inherit; caret-color: var(--accent); }
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.hide-scroll { scrollbar-width: none; } .hide-scroll::-webkit-scrollbar { display: none; }

#device { position: relative; height: 100%; width: 100%; overflow: hidden; background: var(--bg); isolation: isolate; }
@media (min-width: 640px) {
  body { background: var(--surface-2); display: grid; place-items: center; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #device { width: 400px; height: min(860px, 96%); border-radius: 44px; box-shadow: 0 40px 100px -30px rgba(0,0,0,.4), 0 0 0 10px var(--stroke), 0 0 0 11px rgba(0,0,0,.2); }
}

/* motion vocabulary — transform/opacity only */
.press { transition: transform .22s var(--ease-spring); }
.press:active { transform: scale(.95); }
.rise { animation: rise .5s var(--ease-out) backwards; }
.pop { animation: pop .45s var(--ease-spring); }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.985); } }
@keyframes pop { 0% { transform: scale(.7); } 55% { transform: scale(1.14); } 100% { transform: scale(1); } }

/* ------------------------------------------------ screens */
.screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
  padding: max(10px, env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom, 0px)); }
.screen[hidden] { display: none !important; }
.appbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 60px; }
.appbar h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -.03em; }
.appbar .sub { font-size: 13.5px; color: var(--ink-dim); font-weight: 600; }

/* sticker button: ink outline + hard shadow */
.sticker { border: 2.5px solid var(--stroke); background: var(--accent); color: var(--accent-fg); box-shadow: 0 4px 0 var(--stroke);
  border-radius: 18px; font-weight: 800; transition: transform .15s ease, box-shadow .15s ease; }
.sticker:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--stroke); }
.cta { width: 100%; height: 56px; font-size: 16.5px; display: flex; align-items: center; justify-content: center; gap: 8px; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: var(--surface-2); color: var(--ink); font-size: 13px; font-weight: 700; white-space: nowrap; }
.pill.accent { background: var(--accent-soft); color: var(--accent-ink); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill svg { width: 16px; height: 16px; }
.citypill { height: 40px; padding: 0 14px 0 10px; background: var(--surface); box-shadow: var(--shadow-card); font-size: 14px; }
.citypill svg { width: 22px; height: 22px; }

.search { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-card); margin: 4px 0 14px; }
.search svg { width: 22px; height: 22px; flex: none; color: var(--ink-faint); }
.search input { border: 0; outline: 0; background: none; width: 100%; font-size: 16px; font-weight: 500; }
.search input::placeholder { color: var(--ink-faint); }
.search .clr { width: 28px; height: 28px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; flex: none; }
.search .clr[hidden] { display: none; }
.search .clr svg { width: 14px; height: 14px; color: var(--ink-dim); }

.cats { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 18px; padding: 2px 16px 6px; }
.cat { flex: none; display: flex; align-items: center; gap: 7px; height: 42px; padding: 0 14px 0 10px; border-radius: 15px; background: var(--surface); box-shadow: var(--shadow-card);
  font-weight: 700; font-size: 14.5px; color: var(--ink-dim); transition: background .25s, color .25s; }
.cat svg { width: 24px; height: 24px; }
.cat.on { background: var(--ink); color: var(--bg); }

.h2 { display: flex; align-items: center; justify-content: space-between; margin: 22px 2px 10px; }
.h2 b { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
.h2 > span { font-size: 13px; color: var(--ink-dim); font-weight: 700; }

/* recipe cards: photo first */
.rgrid, .pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.rcard, .ptile { position: relative; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow-card); padding: 8px 8px 12px; text-align: start; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.photo { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 18px; overflow: hidden; display: grid; place-items: center; }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.photo svg.art { width: 78%; height: 78%; filter: drop-shadow(0 8px 10px rgba(60,30,5,.22)); }
.photo .badge { position: absolute; top: 8px; inset-inline-start: 8px; height: 26px; padding: 0 9px; border-radius: 9px; background: var(--surface); font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 4px; }
.photo .badge svg { width: 13px; height: 13px; }
.rcard .t, .ptile .t { padding: 0 6px; font-size: 15px; font-weight: 800; line-height: 1.2; text-wrap: balance; }
.rcard .m, .ptile .m { padding: 0 6px; display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.rcard .m small, .ptile .m small { font-size: 11.5px; color: var(--ink-dim); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptile .s { padding: 0 6px; font-size: 12px; color: var(--ink-dim); font-weight: 600; margin-top: -4px; }

/* money: small sign, big digits */
.money { display: inline-flex; align-items: baseline; gap: .06em; direction: ltr; font-variant-numeric: tabular-nums; }
.money i { font-style: normal; font-size: .52em; font-weight: 800; }
.money b { font-weight: 900; letter-spacing: -.045em; line-height: 1; }

/* product tiles */
.pimg { aspect-ratio: 1.15; max-width: 100%; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1px var(--divider) inset; display: grid; place-items: center; overflow: hidden; }
.pimg img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
.pimg svg { width: 46%; height: 46%; }
.fav { position: absolute; top: 14px; inset-inline-end: 14px; width: 32px; height: 32px; border-radius: 11px; background: var(--surface); box-shadow: var(--shadow-card); display: grid; place-items: center; }
.fav svg { width: 19px; height: 19px; }

/* list card */
.card { background: var(--surface); border-radius: 26px; box-shadow: var(--shadow-card); }
.rows { padding: 4px 16px; }
.row { display: flex; align-items: center; gap: 12px; min-height: 60px; width: 100%; text-align: start; }
.row + .row { border-top: 1px solid var(--divider); }
.row .grow { flex: 1; min-width: 0; }
.ttl { font-weight: 700; font-size: 15.5px; }
.ttl small { display: block; font-size: 13px; font-weight: 500; color: var(--ink-dim); margin-top: 1px; }
.row .end { text-align: end; font-weight: 800; white-space: nowrap; }
.row .end small { display: block; font-size: 12px; font-weight: 600; color: var(--ink-dim); }
.thumb { width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 0 0 1px var(--divider) inset; display: grid; place-items: center; overflow: hidden; flex: none; }
.thumb img { width: 100%; height: 100%; object-fit: contain; padding: 4px; }
.thumb > svg, .thumb > span > svg { width: 26px; height: 26px; }
.thumb svg.art { width: 80%; height: 80%; }
.ico { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; flex: none; }
.ico svg { width: 26px; height: 26px; }
.chev { width: 18px; height: 18px; color: var(--ink-faint); flex: none; display: grid; }
.chev svg { width: 18px; height: 18px; }

/* bottom bar */
.tabbar { position: absolute; z-index: 30; left: 0; right: 0; bottom: 0; display: flex; align-items: flex-start; padding: 0 8px env(safe-area-inset-bottom, 0px);
  height: calc(78px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-radius: 28px 28px 0 0; box-shadow: 0 -8px 30px rgba(23,20,15,.08);
  transition: transform .45s var(--ease-out); }
.tabbar.away { transform: translateY(110%); }
.tab { flex: 1; padding-top: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tab > span:first-child { display: flex; }
.tab svg { width: 28px; height: 28px; }
.tab .l { font-size: 12.5px; font-weight: 600; color: var(--ink-dim); }
.tab.on .l { font-weight: 800; color: var(--ink); }
.tab .d { width: 5px; height: 5px; border-radius: 50%; background: var(--ink); transform: scale(0); transition: transform .3s var(--ease-spring); }
.tab.on .d { transform: scale(1); }
.plus-wrap { flex: 1; display: flex; justify-content: center; }
.plus { width: 64px; height: 64px; margin-top: -24px; border-radius: 50%; border-width: 3px; display: grid; place-items: center; }
.plus svg { width: 30px; height: 30px; transition: transform .45s var(--ease-spring); }
.plus.open svg { transform: rotate(45deg); }

/* pushed page */
.page { position: absolute; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; will-change: transform; }
.page .bar { position: sticky; top: 0; z-index: 3; display: flex; justify-content: space-between; padding: max(12px, env(safe-area-inset-top)) 16px 0; height: 0; }
.rb { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow-float); display: grid; place-items: center; color: var(--ink); }
.rb svg { width: 22px; height: 22px; }
.hero { position: relative; height: 330px; display: grid; place-items: center; overflow: hidden; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.hero svg.art { width: 230px; height: 230px; filter: drop-shadow(0 18px 24px rgba(60,30,5,.3)); }
.hero.white { background: #FFFFFF; height: 300px; }
.hero.white img { object-fit: contain; padding: 56px 40px 46px; }
.sheetbody { position: relative; margin-top: -30px; background: var(--bg); border-radius: 30px 30px 0 0; padding: 22px 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
.sheetbody h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -.03em; line-height: 1.1; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.gallery { display: flex; gap: 8px; overflow-x: auto; margin: 16px -16px 0; padding: 4px 16px; }
.gallery > * { flex: none; width: 64px; height: 64px; border-radius: 16px; overflow: hidden; display: grid; place-items: center; }
.gallery button.on { box-shadow: 0 0 0 2.5px var(--ink); }
.gallery img { width: 100%; height: 100%; object-fit: cover; }
.gallery svg.art { width: 80%; height: 80%; }
.gallery .add { background: var(--surface); border: 2px dashed var(--surface-3); cursor: pointer; }
.gallery .add svg { width: 24px; height: 24px; color: var(--ink-dim); }

/* stepper + segmented */
.yield { display: flex; align-items: center; justify-content: space-between; padding: 16px; }
.rbtn { width: 48px; height: 48px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; }
.rbtn svg { width: 22px; height: 22px; }
.yield .mid { text-align: center; }
.yield .mid b { display: block; font-size: 52px; font-weight: 900; letter-spacing: -.04em; line-height: 1; }
.yield .mid small { font-size: 13px; color: var(--ink-dim); font-weight: 700; }
.seg { position: relative; display: flex; padding: 4px; border-radius: 16px; background: var(--surface-2); }
.seg button { position: relative; z-index: 1; flex: 1; height: 40px; border-radius: 12px; font-weight: 800; font-size: 14.5px; color: var(--ink-dim); transition: color .25s; }
.seg button.on { color: var(--ink); }
.seg .th { position: absolute; top: 4px; bottom: 4px; border-radius: 12px; background: var(--surface); box-shadow: 0 2px 8px rgba(23,20,15,.08); transition: left .4s var(--ease-spring), width .4s var(--ease-spring), opacity .2s; }
.mini { display: inline-flex; align-items: center; background: var(--surface-2); border-radius: 13px; padding: 3px; flex: none; }
.mini button { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; transition: background .15s; }
.mini button:active { background: var(--surface); }
.mini svg { width: 16px; height: 16px; }
.mini span { min-width: 58px; text-align: center; font-weight: 800; font-size: 14.5px; }

/* costing */
.big { padding: 18px 18px 6px; display: flex; justify-content: space-between; align-items: flex-end; }
.lbl { font-size: 13px; font-weight: 700; color: var(--ink-dim); margin-bottom: 4px; }
.bar { height: 12px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; transition: width .7s var(--ease-out); }
.bar .c1 { background: var(--ink-faint); } .bar .c2 { background: var(--accent); }
.legend { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--ink-dim); margin-top: 8px; }
.legend b { color: var(--ink); }

/* offers */
.offer { display: grid; grid-template-columns: 40px 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 0; }
.offer + .offer { border-top: 1px solid var(--divider); }
.mono { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; font-weight: 900; font-size: 15px; color: var(--ink); grid-row: span 2; }
.offer .n { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.offer .b { font-size: 12.5px; color: var(--ink-dim); font-weight: 500; }
.offer .p { grid-row: span 2; text-align: end; }
.offer .meter { grid-column: 2 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.offer .meter i { display: block; height: 100%; border-radius: 3px; background: var(--ink-faint); }
.offer.best .meter i { background: var(--accent); }

/* switch, chips, check */
.sw { width: 52px; height: 32px; border-radius: 16px; background: var(--surface-3); position: relative; flex: none; transition: background .25s; }
.sw::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 2px 4px rgba(0,0,0,.2); transition: transform .4s var(--ease-spring); }
.sw.on { background: var(--accent); }
.sw.on::after { transform: translateX(-20px); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 0 14px; }
.chip { height: 36px; padding: 0 14px; border-radius: 12px; font-weight: 700; font-size: 13.5px; background: var(--surface-2); color: var(--ink-dim); transition: background .25s, color .25s, box-shadow .25s; }
.chip.on { background: var(--accent-soft); color: var(--accent-ink); box-shadow: 0 0 0 1.5px var(--accent) inset; }
.check { width: 28px; height: 28px; border-radius: 9px; border: 2.5px solid var(--surface-3); display: grid; place-items: center; flex: none; transition: background .2s, border-color .2s; }
.check svg { width: 16px; height: 16px; color: #fff; transform: scale(0); transition: transform .35s var(--ease-spring); }
.check.on { background: var(--good); border-color: var(--good); }
.check.on svg { transform: scale(1); }
.done .ttl { color: var(--ink-faint); text-decoration: line-through; }

/* sheets */
.scrim { position: absolute; inset: 0; z-index: 60; background: rgba(15,12,8,.45); opacity: 0; }
.sheet { position: absolute; z-index: 61; left: 0; right: 0; bottom: 0; max-height: 92%; display: flex; flex-direction: column;
  background: var(--surface); border-radius: 30px 30px 0 0; box-shadow: var(--shadow-float); will-change: transform; }
.sheet .grab { flex: none; height: 28px; display: grid; place-items: center; touch-action: none; cursor: grab; }
.sheet .grab::before { content: ""; width: 40px; height: 5px; border-radius: 5px; background: var(--surface-3); }
.sheet .in { overflow-y: auto; overscroll-behavior: contain; padding: 0 18px calc(22px + env(safe-area-inset-bottom, 0px)); }
.sheet h3 { margin: 0 0 4px; font-size: 22px; font-weight: 900; letter-spacing: -.02em; }
.sheet .lead { font-size: 14px; color: var(--ink-dim); margin-bottom: 16px; }
.amount { text-align: center; padding: 10px 0 18px; }
.amount .money b { font-size: 56px; } .amount .money i { font-size: 30px; }
.keypad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; direction: ltr; margin-bottom: 14px; }
.keypad button { height: 54px; border-radius: 18px; background: var(--surface-2); font-size: 25px; font-weight: 700; display: grid; place-items: center; }
.keypad svg { width: 26px; height: 26px; }
.addgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding-bottom: 6px; }

.toast { position: absolute; z-index: 80; left: 16px; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 10px;
  background: #17140F; color: #FFFFFF; padding: 14px 16px; border-radius: 18px; font-weight: 700; font-size: 14.5px; box-shadow: var(--shadow-float);

.empty { text-align: center; padding: 34px 20px; }
.empty svg { width: 64px; height: 64px; }
.empty b { display: block; font-size: 18px; font-weight: 800; margin-top: 12px; }
.empty p { font-size: 14px; color: var(--ink-dim); margin: 6px 0 0; line-height: 1.5; }
.basket { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.basket div { border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-card); padding: 12px 10px; text-align: center; }
.basket div.best { box-shadow: 0 0 0 2.5px var(--accent) inset; }
.basket small { display: block; font-size: 12px; font-weight: 700; color: var(--ink-dim); margin-bottom: 4px; }
.note { background: var(--t-butter); border-radius: 22px; padding: 16px 18px; font-size: 15px; line-height: 1.55; }
.foot { text-align: center; font-size: 12.5px; color: var(--ink-faint); margin-top: 22px; line-height: 1.5; }

function hash(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }

  offerCache.set(key, r); return r;
}

  const rows = r.ing.map(([id, q]) => { const p = prod(id), qq = q * f; return { p, q: qq, cost: qq / p.pack * unitPrice(p) }; });
  const ingredients = rows.reduce((s, x) => s + x.cost, 0), pack = r.pack * units, gas = ingredients * r.gas / 100, labor = r.labor * f;
  const total = ingredients + pack + gas + labor;
  return { rows, ingredients, pack, gas, labor, total, perUnit: total / units };
}

/* recipe illustration, until a photo is added */
const cookieCache = new Map();
function cookie(r) {
  if (cookieCache.has(r.id)) return cookieCache.get(r.id);
  const looks = [['var(--dough-a)', 'var(--dough-b)'], ['#D9B47A', '#B48A4E'], ['#5B3A26', '#3E2416'], ['#F2D8A0', '#DDB874']];
  const [a, b] = looks[r.dough]; let seed = Math.floor(hash(r.id) * 1e9);
  const rnd = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  let d = ''; for (let i = 0; i <= 28; i++) { const t = i / 28 * 6.283, rr = 52 + (rnd() - .5) * 5; d += (i ? 'L' : 'M') + (60 + Math.cos(t) * rr).toFixed(1) + ' ' + (60 + Math.sin(t) * rr).toFixed(1); }
  let x = ''; for (let i = 0; i < r.chips; i++) { const g = rnd() * 6.283, rr = 8 + rnd() * 34, cx = (60 + Math.cos(g) * rr).toFixed(1), cy = (60 + Math.sin(g) * rr).toFixed(1);
    x += `<ellipse cx="${cx}" cy="${cy}" rx="${(4 + rnd() * 3).toFixed(1)}" ry="${(3.2 + rnd() * 2.4).toFixed(1)}" style="fill:var(--chip)" transform="rotate(${Math.round(rnd() * 90)} ${cx} ${cy})"/>`; }
  if (r.dough !== 2) for (let i = 0; i < 7; i++) x += `<circle cx="${(28 + rnd() * 64).toFixed(1)}" cy="${(28 + rnd() * 64).toFixed(1)}" r="1.3" style="fill:${b}" opacity=".7"/>`;
  const out = `<svg viewBox="0 0 120 120" class="art" aria-hidden="true"><defs><radialGradient id="g${r.id}" cx="40%" cy="35%" r="70%"><stop offset="0" style="stop-color:${a}"/><stop offset="1" style="stop-color:${b}"/></radialGradient></defs><path d="${d}Z" fill="url(#g${r.id})"/>${x}</svg>`;
  cookieCache.set(r.id, out); return out;
}

/* ================================================================ spring (pages, sheets) — interruptible, keeps velocity */
class Spring {
  constructor(v, on) { this.v = v; this.vel = 0; this.t = v; this.on = on; this.raf = 0; }
  set(v) { cancelAnimationFrame(this.raf); this.raf = 0; this.v = this.t = v; this.vel = 0; this.on(v); }
  to(t, k = 260, c = 30, vel) { this.t = t; this.k = k; this.c = c; if (vel != null) this.vel = vel;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { this.set(t); return Promise.resolve(); }
    return new Promise(res => { this.res = res; if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame(this.tick); } }); }
  tick = now => { const dt = Math.min(.05, (now - this.last) / 1000); this.last = now; const n = Math.max(1, Math.ceil(dt * 480)), h = dt / n;
    for (let i = 0; i < n; i++) { this.vel += (-this.k * (this.v - this.t) - this.c * this.vel) * h; this.v += this.vel * h; }
    if (Math.abs(this.v - this.t) < .0008 && Math.abs(this.vel) < .01) { this.v = this.t; this.raf = 0; this.on(this.v); this.res && this.res(); return; }
    this.on(this.v); this.raf = requestAnimationFrame(this.tick); };
}
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };

/* counted numbers (ease-out quart) */
const counters = new WeakMap();
function countTo(el, to, render) {
  const prev = counters.get(el); counters.set(el, { to, raf: 0 });
  if (prev && prev.raf) cancelAnimationFrame(prev.raf);
  const from = prev ? (prev.shown ?? prev.to) : to;
  if (from === to) { el.innerHTML = render(to); counters.get(el).shown = to; return; }
  const t0 = performance.now(), me = counters.get(el);
  const step = t => { const p = Math.min(1, (t - t0) / 600), v = from + (to - from) * (1 - Math.pow(1 - p, 4)); me.shown = v; el.innerHTML = render(v); if (p < 1) me.raf = requestAnimationFrame(step); else me.raf = 0; };
  me.raf = requestAnimationFrame(step);
}

function segmented(box, opts, val, pick) {
  box.innerHTML = `<span class="th"></span>` + opts.map(([v, l]) => `<button data-v="${v}">${l}</button>`).join('');

  bs.forEach(b => b.onclick = () => { if (b.classList.contains('on')) return; buzz(); set(b.dataset.v); pick(b.dataset.v); });
  th.style.transition = 'none'; requestAnimationFrame(() => { set(val); requestAnimationFrame(() => th.style.transition = ''); });
  return { set };
}

/* ================================================================ pushed pages (enter from the left in RTL; back button, Esc or edge swipe) */
const pages = [];
const under = () => pages.length > 1 ? pages[pages.length - 2].el : document.getElementById('s-' + S.tab);
function page(html, onClose) {
  const el = document.createElement('div'); el.className = 'page'; el.innerHTML = html; device.append(el);
  const api = { el, close }; pages.push(api);
  const below = under();
  const sp = new Spring(1, v => { el.style.transform = `translateX(${-v * 100}%)`; below.style.transform = `translateX(${(1 - v) * 24}%)`; });
  sp.set(1); sp.to(0);
  tabbar.classList.add('away');
  async function close(vel) { if (api.closing) return; api.closing = true; await sp.to(1, 260, 30, vel); pages.splice(pages.indexOf(api), 1); el.remove(); below.style.transform = '';
    if (!pages.length) tabbar.classList.remove('away'); onClose && onClose(); }
  el.querySelector('[data-back]').onclick = () => { buzz(); close(); };
  let d = null; const W = () => device.clientWidth;
  el.addEventListener('touchstart', e => { const t = e.touches[0]; if (t.clientX - device.getBoundingClientRect().left < 28) d = { x: t.clientX, pts: [] }; }, { passive: true });
  el.addEventListener('touchmove', e => { if (!d) return; const dx = Math.max(0, e.touches[0].clientX - d.x); d.pts.push([performance.now(), dx / W()]); sp.set(dx / W()); }, { passive: true });
  el.addEventListener('touchend', () => { if (!d) return; const p = d.pts, v = p.length > 1 ? (p[p.length - 1][1] - p[0][1]) / ((p[p.length - 1][0] - p[0][0]) / 1000 || 1) : 0;
    sp.v > .35 || v > 1 ? close(v) : sp.to(0, 400, 32, v); d = null; });
  return api;
}
addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (sheets.length) sheets[sheets.length - 1].close(); else if (pages.length) pages[pages.length - 1].close(); });

/* ================================================================ bottom sheets (drag down to dismiss) */
const sheets = [];
function sheet(html, onClose) {
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  const el = document.createElement('div'); el.className = 'sheet'; el.setAttribute('role', 'dialog');
  el.innerHTML = `<div class="grab"></div><div class="in">${html}</div>`; device.append(scrim, el);
  const z = 60 + sheets.length * 2; scrim.style.zIndex = z; el.style.zIndex = z + 1;
  const sp = new Spring(1, v => { el.style.transform = `translateY(${v * 100}%)`; scrim.style.opacity = 1 - Math.max(0, v); }); sp.set(1); sp.to(0, 300, 30);
  const api = { el, close }; sheets.push(api);
  async function close(vel) { if (api.closing) return; api.closing = true; sheets.splice(sheets.indexOf(api), 1); scrim.style.pointerEvents = 'none'; await sp.to(1, 300, 32, vel); el.remove(); scrim.remove(); onClose && onClose(); }
  scrim.onclick = () => close();
  const grab = el.querySelector('.grab'), inner = el.querySelector('.in'); let d = null;
  const start = (y, fromInner) => { if (fromInner && inner.scrollTop > 0) return; d = { y, armed: !fromInner, pts: [] }; };
  const move = (y, e) => { if (!d) return; const dy = y - d.y; if (!d.armed) { if (dy > 6) { d.armed = true; d.y = y; } else if (dy < -4) d = null; return; }
    if (e && e.cancelable) e.preventDefault(); const v = (y - d.y) / el.offsetHeight; d.pts.push([performance.now(), v]); sp.set(v < 0 ? v * .25 : v); };
  const end = () => { if (!d) return; if (d.armed) { const p = d.pts, v = p.length > 1 ? (p[p.length - 1][1] - p[0][1]) / ((p[p.length - 1][0] - p[0][0]) / 1000 || 1) : 0; sp.v > .28 || v > 1.2 ? close(v) : sp.to(0, 420, 28, v); } d = null; };
  grab.onpointerdown = e => { grab.setPointerCapture(e.pointerId); start(e.clientY, false); }; grab.onpointermove = e => move(e.clientY); grab.onpointerup = end;
  inner.addEventListener('touchstart', e => start(e.touches[0].clientY, true), { passive: true });
  inner.addEventListener('touchmove', e => move(e.touches[0].clientY, e), { passive: false });
  inner.addEventListener('touchend', end);
  return api;
}

/* numeric keypad — amounts never open the system keyboard */
function keypadSheet(title, lead, initial, onDone) {
  let a = initial ? String(+initial.toFixed(2)) : '';
  const sh = sheet(`<h3>${title}</h3><div class="lead">${lead}</div><div class="amount" id="amt"></div>
    <div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '.', '0', 'back'].map(k => `<button class="press" data-k="${k}" aria-label="${k === 'back' ? 'מחיקה' : k}">${k === 'back' ? li('backspace', 2) : k}</button>`).join('')}</div>
    <button class="sticker cta" id="kpOk">שמירה</button>`);
  const amt = sh.el.querySelector('#amt'), show = () => amt.innerHTML = `<span class="money"><i>₪</i><b>${a || '0'}</b></span>`;
  sh.el.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { buzz(); const k = b.dataset.k;
    if (k === 'back') a = a.slice(0, -1); else if (k === '.') { if (!a.includes('.')) a = (a || '0') + '.'; }
    else if (!(a.includes('.') && a.split('.')[1].length >= 2) && a.replace('.', '').length < 6) a = (a === '0' ? '' : a) + k;
    show(); });
  sh.el.querySelector('#kpOk').onclick = () => { const v = parseFloat(a); if (!(v > 0)) { amt.animate([{ transform: 'none' }, { transform: 'translateX(8px)' }, { transform: 'translateX(-8px)' }, { transform: 'none' }], 260); return; } buzz(); sh.close(); onDone(v); };
  show(); return sh;
}

/* ================================================================ recipe page */
function openRecipe(r) {

  const pg = page(`<div class="bar"><button class="rb press" data-back aria-label="חזרה">${li('back', 2.4)}</button>

        <div style="padding:0 14px 14px"><div class="seg" id="mult"></div></div></div>

      <div class="h2"><b>מרכיבים</b><span id="ingSum"></span></div>
      <div class="card rows" id="ings"></div>

      <div class="h2"><b>תמחיר</b><span>לפי ${S.city}</span></div>
      <div class="card">
        <div class="big"><div><div class="lbl">עלות ל${r.one}</div><span id="cUnit"></span></div><div style="text-align:end"><div class="lbl">סה״כ</div><span id="cTot"></span></div></div>
        <div class="rows">
          <div class="row"><span class="grow ttl">מרכיבים</span><span class="end" id="cIng"></span></div>
          <div class="row"><span class="grow ttl">אריזה<small>לכל ${r.one}</small></span><span class="mini"><button id="pkM" aria-label="פחות">${li('minus', 2.6)}</button><span class="num" id="pkV"></span><button id="pkP" aria-label="יותר">${li('plus', 2.6)}</button></span></div>
          <div class="row"><span class="grow ttl">גז וחשמל<small>אחוז מהמרכיבים</small></span><span class="mini"><button id="gsM" aria-label="פחות">${li('minus', 2.6)}</button><span class="num" id="gsV"></span><button id="gsP" aria-label="יותר">${li('plus', 2.6)}</button></span></div>
          <div class="row"><span class="grow ttl">עבודה<small>למגש של ${r.yield}</small></span><span class="mini"><button id="lbM" aria-label="פחות">${li('minus', 2.6)}</button><span class="num" id="lbV"></span><button id="lbP" aria-label="יותר">${li('plus', 2.6)}</button></span></div>
        </div></div>

      <div class="h2"><b>מחיר ורווח</b></div>
      <div class="card" style="padding:16px">
        <button class="row" id="sellBtn" style="min-height:0;padding-bottom:14px"><span class="grow"><span class="lbl">מחיר מכירה ל${r.one}</span><br><span id="sellV"></span></span><span class="pill">${li('pen', 2.2)}שינוי</span></button>
        <div class="bar"><i class="c1" id="bC"></i><i class="c2" id="bP"></i></div>
        <div class="legend"><span>עלות <b id="lC"></b></span><span>רווח <b id="lP"></b> · <b id="lM"></b></span></div>
        <button class="pill accent press" id="rec" style="margin-top:14px"></button>
      </div>
      ${r.notes ? `<div class="h2"><b>הערות</b></div><div class="note">${r.notes}</div>` : ''}
      <div style="margin-top:22px"><button class="sticker cta" id="toList">הוספה לרשימת הקניות</button></div>
    </div>`, drawRecipeList);
  const $ = id => pg.el.querySelector('#' + id);
  const mult = segmented($('mult'), [['.5', '×½'], ['1', '×1'], ['2', '×2'], ['3', '×3']], '1', v => { units = Math.round(r.yield * +v); update(); });
  const fade = () => $('hero').firstElementChild.animate([{ opacity: 0, transform: 'scale(1.05)' }, { opacity: 1, transform: 'none' }], { duration: 420, easing: 'cubic-bezier(.22,1,.36,1)' });
  function drawGallery() {
    const g = gallery(r);
    $('gal').innerHTML = (g.length ? g.map((s, i) => `<button class="press ${i === (r.coverIdx || 0) ? 'on' : ''}" data-i="${i}" aria-label="תמונה ${i + 1}"><img src="${s}" alt=""></button>`).join('')
      : `<button class="on" style="background:var(${r.tint})" aria-label="איור">${cookie(r)}</button>`)
      + `<label class="add press" aria-label="הוספת תמונה">${li('plus', 2.4)}<input type="file" accept="image/*" hidden class="gfile"></label>`;
    $('gal').querySelectorAll('[data-i]').forEach(b => b.onclick = () => { buzz(); r.coverIdx = +b.dataset.i; $('hero').innerHTML = cover(r); fade(); drawGallery(); });
    $('gal').querySelector('.gfile').onchange = addPhoto;
  }
  function addPhoto(e) { const f = e.target.files[0]; if (!f) return;
    // shrink on the device before storing: the app uploads a small webp, never the original photo
    const im = new Image(); im.onload = () => { const s = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * s; c.height = im.height * s;
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(im.src);
      (S.photos[r.id] = S.photos[r.id] || []).push(c.toDataURL('image/webp', .82)); r.coverIdx = S.photos[r.id].length - 1;
      $('hero').innerHTML = cover(r); fade(); drawGallery(); toast(li('check', 3), 'התמונה נוספה'); };
    im.src = URL.createObjectURL(f); }
  $('file').onchange = addPhoto;
  function update() {
    const c = costing(r, units);
    countTo($('yN'), units, v => Math.round(v));
    const m = units / r.yield; mult.set(['.5', '1', '2', '3'].find(x => Math.abs(+x - m) < .001) ?? '');
    $('mUnit').textContent = `${units} ${r.word}`;
    $('ings').innerHTML = c.rows.map(x => `<button class="row" data-id="${x.p.id}"><span class="thumb">${img(x.p)}</span>
      <span class="grow ttl">${x.p.name}<small>${qty(x.q, x.p.unit)}</small></span><span class="end">${money(x.cost, 15)}<small>${S.manual[x.p.id] != null ? 'מחיר שלי' : offers(x.p)[0].chain.name}</small></span></button>`).join('');
    $('ings').querySelectorAll('[data-id]').forEach(b => b.onclick = () => openProduct(prod(b.dataset.id), update));
    $('ingSum').innerHTML = money(c.ingredients, 13);
    countTo($('cIng'), c.ingredients, v => money(v, 15)); countTo($('cUnit'), c.perUnit, v => money(v, 40)); countTo($('cTot'), c.total, v => money(v, 22));
    $('pkV').textContent = '₪' + fmt(r.pack); $('gsV').textContent = r.gas + '%'; $('lbV').textContent = '₪' + fmt(r.labor, 0);
    countTo($('sellV'), sell, v => money(v, 30));
    const profit = sell - c.perUnit;
    $('bC').style.width = Math.min(100, c.perUnit / sell * 100) + '%'; $('bP').style.width = Math.max(0, profit / sell * 100) + '%';
    $('lC').textContent = '₪' + fmt(c.perUnit); $('lP').textContent = '₪' + fmt(profit); $('lM').textContent = Math.round(profit / sell * 100) + '%';
    $('lP').style.color = profit < 0 ? 'var(--danger)' : '';
    const rec = Math.ceil(c.perUnit / .4 * 2) / 2; $('rec').textContent = `מחיר מומלץ ל־60% רווח: ₪${fmt(rec)}`; $('rec').onclick = () => { buzz(); sell = rec; update(); };
  }
  const step = (id, f) => $(id).onclick = () => { buzz(); f(); update(); };
  step('yM', () => units = Math.max(1, units - 1)); step('yP', () => units++);
  step('pkM', () => r.pack = Math.max(0, +(r.pack - .05).toFixed(2))); step('pkP', () => r.pack = +(r.pack + .05).toFixed(2));
  step('gsM', () => r.gas = Math.max(0, r.gas - 1)); step('gsP', () => r.gas++);
  step('lbM', () => r.labor = Math.max(0, r.labor - 5)); step('lbP', () => r.labor += 5);
  $('sellBtn').onclick = () => keypadSheet(`מחיר ל${r.one}`, 'כמה גובים על יחידה אחת', sell, v => { sell = v; update(); });
  $('toList').onclick = () => { buzz(); const e = S.list.find(x => x[0] === r.id); e ? e[1] += units : S.list.push([r.id, units]); save(); toast(NAV.list(true), `${units} ${r.word} נוספו לרשימה`); };
  drawGallery(); update();
}

/* ================================================================ product page */
function openProduct(p, after) {
  const pg = page(`<div class="bar"><button class="rb press" data-back aria-label="חזרה">${li('back', 2.4)}</button><button class="rb press" id="fav" aria-label="מועדף"></button></div>

    <div class="sheetbody">
      <h1>${p.name}</h1>
      <div class="meta"><span class="pill">${size(p)}</span>${p.code ? `<span class="pill num" style="direction:ltr">${p.code}</span>` : ''}</div>
      <div class="h2"><b id="ofT">מחירים ב${S.city}</b><button class="pill citypill press" id="pc" style="height:34px">${PIN}החלפה</button></div>
      <div class="card rows" id="offers"></div>
      <div class="h2"><b>המחיר שלי</b></div>
      <div class="card rows"><button class="row" id="man"><span class="ico" style="background:var(--t-butter)">${TAG}</span><span class="grow ttl" id="manT"></span><span class="end" id="manV"></span><span class="chev">${li('chev')}</span></button>
        <button class="row" id="manClr" hidden><span class="grow ttl" style="color:var(--danger)">חזרה למחירי הרשתות</span></button></div>
      <div class="h2"><b>התראת ירידת מחיר</b></div>
      <div class="card rows"><div class="row"><span class="ico" style="background:var(--t-sky)">${BELL}</span><span class="grow ttl">להתריע כשהמחיר יורד<small>בכל רשת ב${S.city}</small></span><button class="sw" id="al" role="switch"></button></div>
        <div class="row" id="alRow"><span class="grow ttl">מתחת ל־</span><span class="mini"><button id="alM" aria-label="פחות">${li('minus', 2.6)}</button><span class="num" id="alV"></span><button id="alP" aria-label="יותר">${li('plus', 2.6)}</button></span></div></div>
      <div class="h2"><b>במתכונים</b></div>
      <div class="card rows" id="used"></div>
    </div>`, () => { drawProductList(); after && after(); });
  const $ = id => pg.el.querySelector('#' + id);
  function draw(flip) {
    const os = offers(p), max = os[os.length - 1].price, before = new Map([...$('offers').children].map(n => [n.dataset.c, n.getBoundingClientRect().top]));
    $('offers').innerHTML = os.map((o, i) => `<div class="offer ${i === 0 ? 'best' : ''}" data-c="${o.chain.id}"><span class="mono" style="background:var(${o.chain.c})">${o.chain.m}</span>
      <span class="n">${o.chain.name}${i === 0 ? '<span class="pill good" style="height:22px;padding:0 8px;font-size:11.5px">הכי זול</span>' : ''}</span>
      <span class="p">${money(o.price, 20)}</span><span class="b">${o.branch}</span><span class="meter"><i style="width:${(o.price / max * 100).toFixed(1)}%"></i></span></div>`).join('');
    if (flip) [...$('offers').children].forEach(n => { const b = before.get(n.dataset.c), now = n.getBoundingClientRect().top;
      if (b == null) n.animate([{ opacity: 0 }, { opacity: 1 }], 300); else if (b !== now) n.animate([{ transform: `translateY(${b - now}px)` }, { transform: 'none' }], { duration: 560, easing: 'cubic-bezier(.22,1,.36,1)' }); });
    const m = S.manual[p.id];
    $('manT').innerHTML = m != null ? `מחיר ידני<small>גובר על מחירי הרשתות</small>` : `הזנת מחיר ידני<small>עכשיו לפי הזול ב${S.city}</small>`;
    $('manV').innerHTML = money(m ?? os[0].price, 17); $('manClr').hidden = m == null;
    $('fav').innerHTML = S.favs.has(p.id) ? CAT_ICON.fav : li('heart', 2.2);
    const a = S.alerts[p.id]; $('al').classList.toggle('on', a != null); $('al').setAttribute('aria-checked', a != null); $('alRow').style.opacity = a != null ? 1 : .4; $('alV').textContent = '₪' + fmt(a ?? Math.floor(os[0].price) - .1);
    const used = RECIPES.filter(r => r.ing.some(([id]) => id === p.id));

  }

  $('man').onclick = () => keypadSheet('המחיר שלי', `${p.name} · ${size(p)}`, S.manual[p.id] ?? offers(p)[0].price, v => { S.manual[p.id] = v; save(); draw(); toast(li('check', 3), 'המחיר נשמר'); });
  $('manClr').onclick = () => { buzz(); delete S.manual[p.id]; save(); draw(); toast(li('check', 3), 'חזרה למחירי הרשתות'); };
  $('al').onclick = () => { buzz(); S.alerts[p.id] != null ? delete S.alerts[p.id] : S.alerts[p.id] = Math.floor(offers(p)[0].price) - .1; save(); draw(); if (S.alerts[p.id] != null) toast(BELL, 'נודיע כשהמחיר ירד'); };
  const al = d => () => { if (S.alerts[p.id] == null) return; buzz(); S.alerts[p.id] = Math.max(.9, +(S.alerts[p.id] + d).toFixed(2)); save(); draw(); };
  $('alM').onclick = al(-.5); $('alP').onclick = al(.5);
  $('pc').onclick = () => openCity(() => { draw(true); $('ofT').textContent = `מחירים ב${S.city}`; });
  draw();
}
